services:
  monitor:
    build: .
    image: veeam-telegram-monitor:local
    container_name: veeam-telegram-monitor
    restart: unless-stopped

    # The process runs as `node` and writes nowhere but ./data and ./logs, so it
    # is given nothing more: no capability, no way to gain a privilege, and no
    # file of its own it could rewrite. Whatever got into it would find the
    # image as it was built.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Around 80 MB in use. A leak or a runaway read stops here rather than
    # taking the host's memory with it.
    mem_limit: 512m
    pids_limit: 200

    # The real secrets stay in .env on the host and are handed to the container
    # at start. They are never copied into the image — see .dockerignore.
    env_file: .env

    environment:
      # Fixed inside the container so the port mapping below cannot drift away
      # from what the process listens on; change HOST_PORT, not this.
      PORT: 3000
      # Read when TELEGRAM_TIMEZONE is empty. Set it to the zone whose working
      # day the messages should describe.
      TZ: ${TZ:-Asia/Qyzylorda}

    ports:
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-3000}:3000"

    volumes:
      # telegram-state.json lives here and holds the ids of the live messages.
      # Without this mount every `docker compose up` starts a second copy of
      # every live topic next to the first, and forgets which jobs it has
      # already reported on.
      - ./data:/app/data
      - ./logs:/app/logs
      # The Veeam certificates VEEAM_TLS_CERTS pins, as /app/certs/<name>.pem.
      # Read-only: the service trusts them and has no business changing them.
      - ./certs:/app/certs:ro

    # Docker keeps everything the container prints, and by default keeps all of
    # it forever. The service writes its own rotated log to ./logs as well, so
    # thirty megabytes here are plenty.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # Veeam usually sits outside Docker. If a Veeam server URL points at the host
    # this container runs on, address it as host.docker.internal — `localhost`
    # inside a container is the container. On Linux this mapping is not
    # automatic, which is why it is spelled out.
    extra_hosts:
      - "host.docker.internal:host-gateway"
