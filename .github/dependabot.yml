# Dependabot opens a pull request when a dependency has a new release; the
# test workflow runs on it like on any other. Security fixes come the same way
# once Dependabot alerts are switched on in the repository's settings.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Qyzylorda
    open-pull-requests-limit: 5
    groups:
      # Nest's packages move together; one pull request for all of them.
      nestjs:
        patterns:
          - "@nestjs/*"
      # Build and test tooling, which never ships in the image.
      development:
        dependency-type: development
    ignore:
      # Nest 11 and 12 are a migration, not an update: 12 is ESM-only, and the
      # overrides in package.json stand in for it until then.
      - dependency-name: "@nestjs/*"
        update-types: ["version-update:semver-major"]
      # Each is tied to something else here, so its major is not an update
      # either: the types of Node to the Node the image runs (22), the types
      # of Express to the Express Nest 10 carries (4), and TypeScript to the
      # Nest 10 CLI that builds with it. Offered together they failed CI for
      # a month with nothing to merge.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/express"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
