name: Feature request
description: Something the bot could tell you, or do, that it does not yet.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The situation
      description: What were you trying to find out, or what went unnoticed? The question an operator arrives with matters more than the shape of the answer.
      placeholder: A replica job stopped for a week and nobody saw it, because ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help
      description: What the bot could say, and where (an alert, a live topic, a command).
  - type: textarea
    id: veeam
    attributes:
      label: What Veeam knows about it
      description: If you know where Veeam keeps this (a REST API endpoint, a field, a log line), say so; it decides whether the bot can read it at all.
  - type: textarea
    id: alternatives
    attributes:
      label: How you deal with it today
