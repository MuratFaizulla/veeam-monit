# A tag vX.Y.Z makes a release: the checks of test.yml, then the image on
# ghcr.io for amd64 and arm64, then a GitHub release whose notes are the
# version's section of CHANGELOG.md. The tag must match package.json, and the
# changelog must have the section, or nothing is published.
#
#   npm version 1.1.0 --no-git-tag-version, CHANGELOG.md: [Unreleased] -> [1.1.0]
#   git commit -am "Release 1.1.0" && git tag v1.1.0 && git push origin main v1.1.0
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/test.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # the GitHub release
      packages: write # the image on ghcr.io
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag against package.json and CHANGELOG.md
        id: version
        run: |
          version=${GITHUB_REF_NAME#v}
          declared=$(node -p "require('./package.json').version")
          if [ "$version" != "$declared" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but package.json says $declared"
            exit 1
          fi
          # The section ends at the next heading, or at the links under the last one.
          awk -v heading="## [$version]" \
            'index($0, heading) == 1 { found = 1; next } found && (/^## \[/ || /^\[[^]]+\]: /) { exit } found' \
            CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # ghcr.io takes lower-case names only.
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1.1.0, 1.1, 1 and latest; latest is left off a pre-release.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.version.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE: ${{ steps.version.outputs.image }}
        run: |
          {
            echo "Image: \`$IMAGE:$VERSION\` (linux/amd64, linux/arm64)"
            echo
            cat notes.md
          } > release.md
          flags=()
          case "$VERSION" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file release.md "${flags[@]}"
