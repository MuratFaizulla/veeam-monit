# Runs the whole test suite on every push to main and every pull request, so a
# change that breaks something is caught here — before `git pull` takes it to
# the server. Node matches the image the service runs in (see Dockerfile).
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Builds, then runs every test file; openssl, which the certificate tests
      # use, is part of the runner image.
      - run: npm test
