# What Prometheus scrapes: the bot's /api/metrics, nothing else.
global:
  # The bot reads Veeam once a minute (TELEGRAM_MONITOR_INTERVAL_MS); a scrape
  # more often would only store the same numbers again.
  scrape_interval: 60s
  scrape_timeout: 10s

scrape_configs:
  - job_name: veeam-monitor
    metrics_path: /api/metrics
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics-token
    static_configs:
      # The bot's container, on the bot's network; its port inside the
      # container, whatever HOST_PORT publishes on the host.
      - targets: ['veeam-telegram-monitor:3000']
