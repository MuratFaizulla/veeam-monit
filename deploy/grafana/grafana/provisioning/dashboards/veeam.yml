apiVersion: 1

# The dashboards in deploy/grafana/grafana/dashboards, kept as the repository
# has them: a change made in Grafana's editor is not saved over them. Save a
# copy under another name to keep one, or change the file and deploy again.
providers:
  - name: veeam
    folder: Veeam
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /etc/grafana/dashboards
